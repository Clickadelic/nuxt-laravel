services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        working_dir: /app
        ports:
            - "3000:3000"
        environment:
            NUXT_HOST: 0.0.0.0
            NUXT_PORT: 3000
            NUXT_PUBLIC_API_BASE: http://localhost:8000/api
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
            - frontend_nuxt:/app/.nuxt
        command: npm run dev -- --host 0.0.0.0
        depends_on:
            - backend

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        working_dir: /var/www/html
        ports:
            - "8000:8000"
        environment:
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: laravel
            DB_USERNAME: laravel
            DB_PASSWORD: laravel
        volumes:
            - ./backend:/var/www/html
            - backend_vendor:/var/www/html/vendor
        command: php artisan serve --host=0.0.0.0 --port=8000
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    frontend_node_modules:
    frontend_nuxt:
    backend_vendor:
    mysql_data:
