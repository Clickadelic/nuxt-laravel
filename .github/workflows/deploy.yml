name: Deploy gitis.tobias-hopp.de

on:
    push:
        branches: [prod]
    workflow_dispatch:

concurrency:
    group: deploy-gitis-production
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: "22"
    PHP_VERSION: "8.4"

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Build static Nuxt frontend
              working-directory: frontend
              run: |
                  npm ci
                  npm run generate

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: mbstring, bcmath, xml, curl, pdo_mysql
                  coverage: none
                  tools: composer:v2

            - name: Install production Laravel dependencies
              working-directory: backend
              run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            - name: Write SSH key
              shell: bash
              env:
                  KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
              run: |
                  set -euo pipefail
                  test -n "$KEY_B64"
                  install -m 700 -d "$HOME/.ssh"
                  echo "$KEY_B64" | base64 --decode > "$HOME/.ssh/webgo_deploy"
                  chmod 600 "$HOME/.ssh/webgo_deploy"
                  ssh-keygen -lf "$HOME/.ssh/webgo_deploy" >/dev/null

            - name: Add SSH host key
              shell: bash
              run: |
                  set -euo pipefail
                  PORT='${{ secrets.DEPLOY_PORT }}'
                  PORT="${PORT:-22}"
                  ssh-keyscan -p "$PORT" -H '${{ secrets.DEPLOY_HOST }}' >> "$HOME/.ssh/known_hosts"

            - name: Verify deployment configuration
              shell: bash
              run: |
                  test -n '${{ secrets.DEPLOY_HOST }}'
                  test -n '${{ secrets.DEPLOY_USER }}'
                  test -n '${{ secrets.DEPLOY_ENV_FILE_B64 }}'
                  test -n '${{ secrets.DEPLOY_FRONTEND_PATH }}'
                  test -n '${{ secrets.DEPLOY_BACKEND_PATH }}'

            - name: Ensure remote directories exist
              shell: bash
              run: |
                  set -euo pipefail
                  PORT='${{ secrets.DEPLOY_PORT }}'
                  PORT="${PORT:-22}"
                  ssh -i "$HOME/.ssh/webgo_deploy" -p "$PORT" \
                    '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' \
                    "mkdir -p '${{ secrets.DEPLOY_FRONTEND_PATH }}' '${{ secrets.DEPLOY_BACKEND_PATH }}'"

            - name: Upload frontend
              shell: bash
              run: |
                  set -euo pipefail
                  PORT='${{ secrets.DEPLOY_PORT }}'
                  PORT="${PORT:-22}"
                  rsync -az --delete \
                    -e "ssh -i $HOME/.ssh/webgo_deploy -p $PORT" \
                    frontend/.output/public/ \
                    '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_FRONTEND_PATH }}/'

            - name: Upload Laravel application
              shell: bash
              run: |
                  set -euo pipefail
                  PORT='${{ secrets.DEPLOY_PORT }}'
                  PORT="${PORT:-22}"
                  rsync -az --delete \
                    --exclude=.env \
                    --exclude=storage/logs \
                    --exclude=tests \
                    -e "ssh -i $HOME/.ssh/webgo_deploy -p $PORT" \
                    backend/ \
                    '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_BACKEND_PATH }}/'

            - name: Upload Laravel environment
              shell: bash
              env:
                  ENV_FILE_B64: ${{ secrets.DEPLOY_ENV_FILE_B64 }}
              run: |
                  set -euo pipefail
                  echo "$ENV_FILE_B64" | base64 --decode > backend/.env
                  PORT='${{ secrets.DEPLOY_PORT }}'
                  PORT="${PORT:-22}"
                  rsync -az \
                    -e "ssh -i $HOME/.ssh/webgo_deploy -p $PORT" \
                    backend/.env \
                    '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_BACKEND_PATH }}/.env'
                  rm -f backend/.env

            - name: Run Laravel deployment commands
              shell: bash
              run: |
                  set -euo pipefail
                  PORT='${{ secrets.DEPLOY_PORT }}'
                  PORT="${PORT:-22}"
                  ssh -i "$HOME/.ssh/webgo_deploy" -p "$PORT" \
                    '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' \
                    "cd '${{ secrets.DEPLOY_BACKEND_PATH }}' && \
                     mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache; \
                     php artisan config:clear; \
                     php artisan migrate --force; \
                     php artisan config:cache; \
                     php artisan route:cache"
